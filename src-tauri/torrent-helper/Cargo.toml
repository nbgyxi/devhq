[package]
name = "wint-torrent-helper"
version = "0.1.0"
edition = "2021"
description = "Isolated BitTorrent engine host for WinT. Speaks JSON lines over stdio."
license = "SEE LICENSE IN ../../LICENSE"
publish = false

[[bin]]
name = "wint-torrent-helper"
path = "src/main.rs"

[dependencies]
librqbit = { version = "9", default-features = false, features = ["default-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "sync", "time", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi"] }

# Just enough of Win32 to wait on WinT's process handle, which is how the
# engine knows WinT has gone when the pipe it would otherwise notice that
# through has been inherited by some other child and left open. Same version
# the app uses, so it is already built.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
] }
