[package]
name = "wint-torrent-helper"
version = "0.1.0"
edition = "2021"
description = "Isolated BitTorrent engine host for WinT. Speaks JSON lines over stdio."
license = "SEE LICENSE IN ../../LICENSE"
publish = false

[[bin]]
name = "wint-torrent-helper"
path = "src/main.rs"

[dependencies]
librqbit = { version = "9", default-features = false, features = ["default-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "sync", "time", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi"] }
