[package]
name = "wint-term-host"
version = "0.1.0"
edition = "2021"
description = "WinT's terminal engine as a console program, for the VS Code panel. Speaks JSON lines over stdio."
license = "SEE LICENSE IN ../../LICENSE"
publish = false

[[bin]]
name = "wint-term-host"
path = "src/main.rs"

# No Tauri anywhere in here: the VS Code extension ships this file on its own,
# and it has to run whether WinT is installed, running, or neither.
[dependencies]
wint-term = { path = "../term-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
