[package]
name = "wint"
version = "0.1.0"
default-run = "wint"
description = "WinT - developer overview of your projects"
authors = ["Gyxi"]
edition = "2021"
license = "SEE LICENSE IN ../LICENSE"
rust-version = "1.77.2"

[lib]
name = "wint_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "stream"] }
zip = { version = "4", default-features = false, features = ["deflate"] }
tauri = { version = "2", features = ["image-png", "tray-icon", "unstable"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", default-features = false, features = ["windows-native"] }
windows = { version = "0.61", features = [
  "Wdk_System_Threading",
  "Win32_Foundation",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_Kernel",
  "Win32_System_Console",
  "Win32_System_Pipes",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_Security",
  "Win32_System_Threading",
  "Win32_System_ProcessStatus",
  "Win32_System_Power",
  "Win32_System_SystemInformation",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_UI_Shell",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_Networking_WinHttp",
  "Win32_NetworkManagement_IpHelper",
  "Win32_UI_WindowsAndMessaging"
] }
webview2-com = "0.38.2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
