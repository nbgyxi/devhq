[package]
name = "wint"
version = "0.1.0"
default-run = "wint"
description = "WinT - developer overview of your projects"
authors = ["Gyxi"]
edition = "2021"
license = "SEE LICENSE IN ../LICENSE"
rust-version = "1.77.2"

[lib]
name = "wint_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
sha2 = "0.10"
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "stream"] }
zip = { version = "4", default-features = false, features = ["deflate"] }
tauri = { version = "2", features = ["image-png", "tray-icon", "unstable"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
png = "0.17"
# Fallback when Windows has no shell thumbnail yet: decode the image ourselves.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", default-features = false, features = ["windows-native"] }
windows = { version = "0.61", features = [
  "ApplicationModel",
  "ApplicationModel_Activation",
  "Foundation",
  "Wdk_System_SystemInformation",
  "Wdk_System_Threading",
  "Win32_Foundation",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Kernel",
  "Win32_System_Console",
  "Win32_System_Pipes",
  "Win32_Storage_FileSystem",
  "Win32_Storage_Packaging_Appx",
  "Win32_System_Registry",
  "Win32_System_IO",
  "Win32_Security",
  "Win32_System_Threading",
  "Win32_System_ProcessStatus",
  "Win32_System_Power",
  "Win32_System_SystemInformation",
  "Win32_System_Com",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_Globalization",
  "Win32_Devices_FunctionDiscovery",
  "Win32_System_DataExchange",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Ole",
  "Win32_System_SystemServices",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_HiDpi",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Dwm",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_Networking_WinHttp",
  "Win32_NetworkManagement_IpHelper",
  "Win32_NetworkManagement_WiFi",
  "Win32_NetworkManagement_Ndis",
  "Win32_UI_WindowsAndMessaging"
] }
webview2-com = "0.38.2"
# `#[implement]` for the drag source handed to Windows when files are dragged out.
windows-core = "0.61"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

# Debug builds are never shipped and never stepped through in a debugger —
# this repo is verified with `cargo check`, `cargo clippy` and the CLI
# examples. Full debuginfo on a crate this size was costing tens of GB in
# `target/debug/deps` for information nothing here reads; line tables keep
# the file and line numbers in a backtrace, which is the part that is used.
#
# Note that this does nothing about accumulation: Cargo never deletes an old
# artifact, so `target` still grows forever across dependency bumps and
# toolchain changes. `cargo sweep --time 30` is what prunes it.
[profile.dev]
debug = "line-tables-only"
