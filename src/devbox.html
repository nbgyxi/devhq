<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Dev box</title>
<link rel="icon" type="image/png" href="wint-icon.png" />
<link rel="stylesheet" href="styles.css" />
</head>
<body class="popout devbox">
<div class="titlebar">
  <div class="drag">
    <div class="brand"><img src="wint-icon.png" alt="" />
      <span id="db-project">Dev box</span>
      <span class="sub" id="db-subtitle"></span>
    </div>
  </div>
  <div class="db-toggles" id="db-toggles" role="group" aria-label="Show or hide panels"></div>
  <div class="win-btns">
    <button class="win-btn" data-win="min"><span class="ms">remove</span></button>
    <button class="win-btn" data-win="max"><span class="ms">crop_square</span></button>
    <button class="win-btn close" data-win="close" title="Close this dev box" aria-label="Close this dev box"><span class="ms">close</span></button>
  </div>
</div>

<div id="db-grid">
  <div class="db-col db-left">
    <section class="db-slot" data-slot="left-top"></section>
    <div class="db-grip db-grip-h" data-grip="leftSplit" role="separator" aria-label="Resize the left panels"></div>
    <section class="db-slot" data-slot="left-bottom"></section>
  </div>
  <div class="db-grip db-grip-v" data-grip="left" role="separator" aria-label="Resize the left column"></div>
  <div class="db-center-col" id="db-center-col">
    <section class="db-slot db-center" data-slot="center"></section>
  </div>
  <div class="db-grip db-grip-v" data-grip="right" role="separator" aria-label="Resize the right column"></div>
  <section class="db-slot db-right" data-slot="right"></section>
</div>
<!-- The bottom panel and its divider move together, between the center column
     and the foot of the window. It sits under the center panel where there is
     one, and only spreads across everything when there is not. -->
<div id="db-bottom-dock">
  <div class="db-grip db-grip-h db-grip-bottom" data-grip="bottom" role="separator" aria-label="Resize the bottom panel"></div>
  <section class="db-slot db-bottom" data-slot="bottom"></section>
</div>

<div class="db-drop" id="db-drop" hidden></div>
<div class="db-status" id="db-status">Ready</div>

<script src="analytics.js"></script>
<script src="i18n.js"></script>
<script>window.wintI18n.init(window.wintI18n.storedLanguage());</script>
<script src="terminal.js"></script>
<script src="devbox.js"></script>
</body>
</html>
