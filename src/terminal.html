<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Terminal</title>
<link rel="icon" type="image/png" href="devhq-icon.png" />
<link rel="stylesheet" href="styles.css" />
</head>
<body class="popout">
<div class="titlebar">
  <div class="drag" title="Drag onto DevHQ's terminal area to dock">
    <div class="brand"><img src="devhq-icon.png" alt="" />
      <i class="shell-mark" id="pop-shell" hidden></i>
      <span id="pop-project">Terminal</span>
      <span class="sub" id="pop-title"></span>
    </div>
  </div>
  <div class="win-btns">
    <button class="win-btn" id="pop-ontop" title="Keep this window on top" aria-pressed="false"><span class="ms">keep</span></button>
    <button class="win-btn" id="pop-dock" title="Dock back into DevHQ"><span class="ms">dock_to_bottom</span></button>
    <button class="win-btn" data-win="min"><span class="ms">remove</span></button>
    <button class="win-btn" data-win="max"><span class="ms">crop_square</span></button>
    <button class="win-btn close" data-win="close" title="Close this terminal" aria-label="Close this terminal"><span class="ms">close</span></button>
  </div>
</div>
<div id="pop-term" class="term-host"></div>
<div class="term-shutdown" id="pop-shutdown" role="alertdialog" aria-modal="true" aria-labelledby="pop-shutdown-title" hidden>
  <div class="term-shutdown-card">
    <span class="term-shutdown-spinner" aria-hidden="true"></span>
    <div><strong id="pop-shutdown-title">Closing&hellip;</strong><p>Giving the terminal a moment to finish safely.</p></div>
    <label class="term-never-wait" id="pop-never-wait" hidden><input type="checkbox" id="pop-never-wait-input" /><span>Never wait for <b id="pop-never-wait-name"></b></span></label>
    <div class="term-shutdown-actions"><button type="button" id="pop-interrupt-again" hidden>Send Ctrl+C again</button><button type="button" id="pop-shutdown-cancel">Cancel</button><button type="button" class="danger" id="pop-close-now" hidden>Close now</button></div>
  </div>
</div>
<script src="analytics.js"></script>
<script src="i18n.js"></script>
<script>window.devhqI18n.init(window.devhqI18n.storedLanguage());</script>
<script src="terminal.js"></script>
<script src="popout.js"></script>
</body>
</html>
