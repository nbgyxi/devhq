<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: transparent; }
  body { box-sizing: border-box; border: 1px solid rgba(110, 168, 254, .9); background: rgba(18, 20, 27, .42); }
  body::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.04), inset -12px 0 24px rgba(0,0,0,.24);
  }
</style>
</head>
<body></body>
</html>
