<!DOCTYPE html>
<html lang="en" data-projects-window="true">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Projects</title>
<link rel="icon" type="image/png" href="wint-icon.png" />
<script src="error-log.js"></script>
<script src="demo-mode.js?v=1"></script>
<script>
/* The Projects tool in a window of its own. Same shell code as the main window,
   without the terminals, assistant and tools that must only ever run once. */
(function () {
  var theme = new URLSearchParams(location.search).get("theme");
  if (theme !== "light" && theme !== "dark") {
    try { theme = JSON.parse(localStorage.getItem("wint.prefs.v1") || "{}").theme; } catch (e) {}
  }
  document.documentElement.dataset.theme = theme === "light" ? "light" : "dark";
})();
</script>
<style>html,body{background:#0c0d11}html[data-theme="light"],html[data-theme="light"] body{background:#f4f5f8}</style>
