<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      document.documentElement.dataset.theme =
        new URLSearchParams(location.search).get("theme") === "light"
          ? "light"
          : "dark";
    </script>
    <link rel="stylesheet" href="styles.css?v=0.87.1" />
    <link rel="stylesheet" href="clipboard-picker.css?v=1" />
  </head>
  <body>
    <main class="picker">
      <button
        class="drag"
        id="drag"
        type="button"
        aria-label="Move clipboard history"
      >
        <i></i>
      </button>
      <header>
        <span class="ms">content_paste</span><strong>Clipboard history</strong
        ><small>Press the shortcut again to move down</small><kbd>Esc</kbd>
      </header>
      <div id="clips" class="clips" role="listbox"></div>
      <footer>
        <span><kbd>↑</kbd><kbd>↓</kbd> navigate</span
        ><span><kbd>Enter</kbd> copy back</span
        ><button id="full" type="button">Open full history</button>
      </footer>
    </main>
    <script src="clipboard-picker.js?v=1"></script>
  </body>
</html>
